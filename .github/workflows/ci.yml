# CI gate: typecheck (kit-native .ts files), unit tests (engine), kit-lint, doc-validate,
# allowlisted diagram-validate (strict tools), and an "engine drift" check — rebuild every
# example .src.ts and fail if the committed .drawio files no longer match.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Kit lint (index surfaces, EN/VI parity, version trio, stale claims)
        run: bash scripts/tsrun.sh scripts/kit-lint.ts

      - name: Validate example documents
        run: bash scripts/tsrun.sh scripts/doc-validate.ts example/atlas-re

      - name: Install D2
        run: |
          curl -fsSL https://d2lang.com/install.sh | sh -s --
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Ensure PlantUML jar (offline render)
        run: bash scripts/plantuml-ensure.sh

      - name: Install Mermaid CLI + Chrome
        run: |
          npm install -g @mermaid-js/mermaid-cli
          npx --yes puppeteer browsers install chrome

      - name: Install BPMN engine deps
        run: npm ci --prefix skills/bpmn/engine

      # azure.json (~13.5MB) + gcp.json (~1.9MB) are gitignored, downloaded on demand — cache them.
      - name: Cache large draw.io catalogs
        uses: actions/cache@v4
        with:
          path: |
            skills/drawio/catalog/azure.json
            skills/drawio/catalog/gcp.json
          key: drawio-catalogs-${{ hashFiles('scripts/drawio-catalog-ensure.sh') }}

      - name: Ensure draw.io catalogs (azure + gcp)
        run: bash scripts/drawio-catalog-ensure.sh

      - name: Validate example diagrams (allowlist, strict tools)
        run: bash scripts/tsrun.sh scripts/validate-example-diagrams.ts --strict-tools

      - name: Rebuild example diagrams (engine drift check)
        run: bash scripts/tsrun.sh skills/drawio/engine/drawio-build.ts --dir example/atlas-re/drawio

      - name: Fail on drift between engine output and committed .drawio
        run: |
          git diff --exit-code -- example/atlas-re/drawio || {
            echo "::error::Engine output no longer matches the committed example .drawio files."
            echo "::error::Rebuild locally (drawio-build --dir example/atlas-re/drawio) and commit the result."
            exit 1
          }
