<!--
  prototype.html — self-contained clickable prototype shell for /prototype-html.
  Every screen is a <section id="s{n}">; nav edges are data-go="s{n}" attributes.
  Minimal JS switches the visible screen. Fill {{feature}}, {{device}}, screens.
  adapted from the kit's system-design/resources HTML precedent — see NOTICE
-->
<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{feature}} — prototype</title>
<style>
  :root { --w: {{device}}px; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e4e4e7; font: 14px/1.4 -apple-system, Segoe UI, Roboto, sans-serif; color: #111;
    display: flex; justify-content: center; }
  .device { width: var(--w); min-height: 100vh; background: #fff; border-left: 1px solid #d4d4d8; border-right: 1px solid #d4d4d8; }
  .screen { display: none; padding: 16px; min-height: 100vh; }
  .screen.active { display: block; }
  .scr-head { font-weight: 700; border-bottom: 2px solid #111; padding-bottom: 8px; margin-bottom: 14px; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .lbl { width: 110px; color: #52525b; font-size: 12px; }
  .box { flex: 1; border: 1px solid #71717a; height: 30px; }
  .btn { border: 1px solid #111; padding: 8px 16px; background: #fff; cursor: pointer; font-size: 13px; margin-right: 8px; }
  .btn.primary { background: #111; color: #fff; }
  .nav-note { color: #71717a; font-size: 11px; margin-top: 4px; }
</style>
</head>
<body>
<div class="device">

  <section class="screen active" id="s1">
    <div class="scr-head">[1] Claim queue</div>
    <div class="row"><span class="lbl">Search</span><span class="box"></span></div>
    <p>3 claims in your tier:</p>
    <div class="row"><span class="btn primary" data-go="s2">Open CLM-204</span></div>
    <div class="nav-note">→ [2] Claim detail</div>
  </section>

  <section class="screen" id="s2">
    <div class="scr-head">[2] Claim detail</div>
    <div class="row"><span class="lbl">Amount</span><span class="box">USD 250,000</span></div>
    <div class="row"><span class="lbl">Reserves</span><span class="box">✓ validated</span></div>
    <div class="row"><span class="btn primary" data-go="s3">Decide</span></div>
    <div class="nav-note">→ [3] Decision panel</div>
  </section>

  <section class="screen" id="s3">
    <div class="scr-head">[3] Decision panel</div>
    <div class="row"><span class="lbl">Decision</span></div>
    <div class="row"><span class="btn primary" data-go="s4">Approve</span><span class="btn" data-go="s4">Reject</span></div>
    <div class="nav-note">→ [4] Confirmation</div>
  </section>

  <section class="screen" id="s4">
    <div class="scr-head">[4] Confirmation</div>
    <p>Decision recorded. Handler notified.</p>
    <div class="row"><span class="btn primary" data-go="s1">Back to queue</span></div>
  </section>

</div>
<script>
  document.querySelectorAll('[data-go]').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      const t = document.getElementById(el.dataset.go);
      if (t) { t.classList.add('active'); t.scrollIntoView(); }
    });
  });
</script>
</body>
</html>
